services:
  commander:
    build: .
    container_name: discord-commander
    command: ["python", "-m", "commander.bot"]
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    secrets:
      - infisical_client_id
      - infisical_client_secret
      - infisical_project_id
    environment:
      INFISICAL_CLIENT_ID_FILE: /run/secrets/infisical_client_id
      INFISICAL_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
      INFISICAL_PROJECT_ID_FILE: /run/secrets/infisical_project_id
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TURSO_LOCAL_DB_PATH: ${TURSO_LOCAL_DB_PATH:-/data/turso/local.db}
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - shared_turso_data:/data/turso

  worker:
    build: .
    container_name: worker-pooling
    command: ["python", "-m", "worker.main"]
    restart: unless-stopped
    # Commander depends on this to know the shared local replica has been bootstrapped at least
    # once before it starts reading it (see the `depends_on` above and
    # migrations/worker_split_shared_cache.md). Only guards the first cold start of the volume --
    # later independent restarts of either container find the file already there.
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/turso/local.db"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    secrets:
      - infisical_client_id
      - infisical_client_secret
      - infisical_project_id
    environment:
      INFISICAL_CLIENT_ID_FILE: /run/secrets/infisical_client_id
      INFISICAL_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
      INFISICAL_PROJECT_ID_FILE: /run/secrets/infisical_project_id
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TURSO_LOCAL_DB_PATH: ${TURSO_LOCAL_DB_PATH:-/data/turso/local.db}
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - shared_turso_data:/data/turso

secrets:
  infisical_client_id:
    file: ~/secrets/infisical/INFISICAL_CLIENT_ID
  infisical_client_secret:
    file: ~/secrets/infisical/INFISICAL_CLIENT_SECRET
  infisical_project_id:
    file: ~/secrets/infisical/INFISICAL_PROJECT_ID

volumes:
  shared_turso_data:
